[Service]
# Firecracker guests do not expose a power button/ACPI poweroff device with this
# kernel configuration. A normal guest `poweroff` otherwise reaches the kernel's
# halted state while the Firecracker process remains alive, leaving srv unable to
# distinguish it from a running VM. Force a reboot syscall instead; with the
# control plane's `reboot=k` kernel argument, this exits the microVM process.
ExecStart=
ExecStart=/usr/bin/systemctl --force --force reboot
