[Unit]
# Only an identity installed by srv-wazuh-enroll may start the agent, so a
# fresh image or a sanitized template never reports as a stale or empty agent.
Requires=srv-wazuh-owners.service
After=srv-bootstrap.service srv-wazuh-owners.service

[Service]
ExecStartPre=/usr/local/lib/srv/wazuh-enroll.sh check
